[preset.0]
name="Tower-Windows"
platform="Windows Desktop"
runnable=true
advanced_options=true
custom_features="release_build,tower_release"
export_filter="all_resources"
include_filter="data/*.json,data/tower_legal/*.txt"
exclude_filter="tools/*,build/*,*.md,*.log,*.py,*.ps1,.git/*"
export_path="build/InkSpire.exe"
script_export_mode=2

[preset.0.options]
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon="res://assets/graphics/tower/app-icon.ico"
application/file_version="0.3.0.0"
application/product_version="0.3.0"
application/product_name="高中异闻：尖塔"
application/file_description="高中异闻：尖塔 0.3.0"
application/export_angle=0
application/export_d3d12=0

[preset.1]
name="Tower-Android"
platform="Android"
runnable=true
advanced_options=true
custom_features="release_build,tower_release"
export_filter="all_resources"
include_filter="data/*.json,data/tower_legal/*.txt"
exclude_filter="tools/*,build/*,*.md,*.log,*.py,*.ps1,.git/*,*.ico"
export_path="build/InkSpire.apk"
script_export_mode=2

[preset.1.options]
custom_template/release=""
gradle_build/use_gradle_build=false
